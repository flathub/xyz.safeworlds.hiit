id: xyz.safeworlds.hiit
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: hiit
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
modules:
  - name: hiit
    buildsystem: meson
    run-tests: true
    sources:
      - type: git
        url: https://gitlab.gnome.org/World/exercise-timer
        commit: 9622d12c09034138a55c9741bcd87441f4d7a282
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
        tag: v1.11.0
