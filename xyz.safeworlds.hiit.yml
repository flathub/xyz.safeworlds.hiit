id: xyz.safeworlds.hiit
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: hiit
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
modules:
  - name: hiit
    buildsystem: meson
    run-tests: true
    sources:
      - type: git
        url: https://gitlab.gnome.org/World/exercise-timer
        commit: fbcc09f70cdd97eb0d6278d1fc84559f30d258cc
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
        tag: v1.10.0
