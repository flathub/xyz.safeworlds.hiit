id: xyz.safeworlds.hiit
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: hiit
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
modules:
  - name: hiit
    buildsystem: meson
    run-tests: true
    sources:
      - type: git
        url: https://github.com/mfep/exercise-timer
        commit: a2991b2c6c544b67f76478a356f183cae27adf3e
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
        tag: v1.9.0
